version: "2"

run:
  timeout: 5m
  tests: true

linters:
  disable-all: true
  enable:
    - govet
    - errcheck
    - staticcheck
    - ineffassign
    - gocritic

formatters:
  enable:
    - gofmt

formatters-settings:
  gofmt:
    simplify: true

linters-settings:
  gocritic:
    disabled-checks:
      - ifElseChain
      - hugeParam

issues:
  exclude-rules:
    - path: _test\.go
      linters:
        - errcheck
        - gocritic
        - staticcheck
        - revive
        - govet
    - path: cmd/alfred
      text: "G304.*no value"
      linters:
        - gocritic
    # Phase 1 stylistics — addressed in later phases
    - linters:
        - revive
      text: "unused-parameter"
    - linters:
        - revive
      text: "exported.*should have comment"
    - linters:
        - revive
      text: "stutters"

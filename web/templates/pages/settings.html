{{define "settings"}}{{template "layout" .}}
{{define "content"}}
<div class="settings-page" style="display:flex;height:100vh;background:var(--bg-primary);color:var(--fg-primary)">
  <aside class="settings-sidebar" style="width:240px;padding:24px 16px;border-right:1px solid var(--border-subtle)">
    <h2 style="font-size:18px;margin-bottom:24px;color:var(--fg-accent)">Settings</h2>
    <nav>
      <a href="#general" class="settings-nav-item active" style="display:block;padding:8px 12px;border-radius:8px;margin-bottom:4px;text-decoration:none;color:var(--fg-primary)">General</a>
      <a href="#agents" class="settings-nav-item" style="display:block;padding:8px 12px;border-radius:8px;margin-bottom:4px;text-decoration:none;color:var(--fg-primary)">Agents</a>
      <a href="#keyboard" class="settings-nav-item" style="display:block;padding:8px 12px;border-radius:8px;margin-bottom:4px;text-decoration:none;color:var(--fg-primary)">Keyboard</a>
      <a href="#speech" class="settings-nav-item" style="display:block;padding:8px 12px;border-radius:8px;margin-bottom:4px;text-decoration:none;color:var(--fg-primary)">Speech</a>
      <a href="#remote" class="settings-nav-item" style="display:block;padding:8px 12px;border-radius:8px;margin-bottom:4px;text-decoration:none;color:var(--fg-primary)">Remote</a>
    </nav>
  </aside>
  <main class="settings-content" style="flex:1;padding:32px 48px;overflow-y:auto">
    <div id="settings-general">{{template "settings_general" .}}</div>
    <div id="settings-agents" style="display:none">{{template "settings_agents" .}}</div>
    <div id="settings-keyboard" style="display:none">{{template "settings_keyboard" .}}</div>
    <div id="settings-speech" style="display:none">{{template "settings_speech" .}}</div>
    <div id="settings-remote" style="display:none">{{template "settings_remote" .}}</div>
  </main>
</div>
<script>
document.querySelectorAll('.settings-nav-item').forEach(function(el) {
  el.addEventListener('click', function(e) {
    e.preventDefault();
    document.querySelectorAll('.settings-nav-item').forEach(function(n) { n.classList.remove('active'); });
    el.classList.add('active');
    document.querySelectorAll('[id^="settings-"]').forEach(function(s) { s.style.display = 'none'; });
    var target = el.getAttribute('href').substring(1);
    var panel = document.getElementById('settings-' + target);
    if (panel) panel.style.display = 'block';
  });
});
</script>
{{end}}{{end}}

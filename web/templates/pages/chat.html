{{define "content"}}
<div class="ds-layout">
  <aside class="ds-sidebar" id="sidebar"
         hx-get="/ui/sidebar"
         hx-trigger="load, refresh from:body"
         hx-swap="innerHTML">
    <div class="ds-empty"><span class="ds-thinking-dot"></span></div>
  </aside>

  <main class="ds-main">
    <div class="ds-timeline" id="timeline"
         {{if .ThreadID}}hx-get="/ui/threads/{{.ThreadID}}/timeline"{{end}}
         hx-trigger="load, refresh from:body"
         hx-swap="innerHTML">
      {{if not .ThreadID}}
      <div class="ds-empty">
        <div style="font-size:2rem;color:var(--ds-accent);font-weight:700">A</div>
        <div>Select a thread or create a new one</div>
      </div>
      {{end}}
    </div>

    <div class="ds-composer" id="composer">
      {{if .ThreadID}}
      <form hx-post="/ui/threads/{{.ThreadID}}/turns"
            hx-target="#timeline"
            hx-swap="beforeend"
            hx-on::after-request="this.reset()">
        <div style="display:flex;gap:8px;align-items:flex-end">
          <textarea name="text" class="ds-input ds-textarea"
                    placeholder="Type a message..."
                    rows="1"
                    hx-on::keydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();this.closest('form').requestSubmit()}"></textarea>
          <button type="submit" class="ds-btn ds-btn-primary">Send</button>
        </div>
      </form>
      {{else}}
      <div class="ds-empty" style="padding:var(--ds-space-sm)">
        <span style="color:var(--ds-text-faint);font-size:var(--ds-font-size-sm)">Create a thread to start</span>
      </div>
      {{end}}
    </div>
  </main>
</div>
<script src="/static/js/sidebar-sse.js"></script>
{{end}}
